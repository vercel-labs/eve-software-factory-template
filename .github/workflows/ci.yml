name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The agent reads its target repo and Linear connector UID at module load
      # so misconfiguration fails discovery rather than a live request. `eve
      # info` therefore needs them set. These are throwaway placeholders: CI
      # only compiles the agent, it never reaches GitHub or Linear.
      - run: pnpm validate
        env:
          FACTORY_REPO: acme/widgets
          LINEAR_CONNECTOR: linear/foreman-agent
