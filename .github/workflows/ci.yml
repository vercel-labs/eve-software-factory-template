name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, discovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Everything here is offline and deterministic: no model, no GitHub App,
      # no Blob store, no sandbox. The suite sets its own placeholder
      # environment, so the job needs no secrets.
      #
      # FACTORY_REQUIRE_CLI_TESTS makes the tests that run the real git and
      # gh binaries (both ship on the hosted runners) fail when a binary is
      # missing, where a local run would skip them.
      - run: pnpm validate
        env:
          EVE_TELEMETRY_DISABLED: "1"
          FACTORY_REQUIRE_CLI_TESTS: "1"
